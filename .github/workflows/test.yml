name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify test dependencies
        run: |
          bash --version
          git --version

      - name: Run integration tests
        run: bash tests/test_git_tp.sh